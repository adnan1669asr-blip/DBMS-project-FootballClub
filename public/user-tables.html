<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Tables</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="brand">
                <div class="brand-mark">FT</div>
                <div>
                    <h1>Football Team Management</h1>
                    <p>User table overview</p>
                </div>
            </div>
        </header>

        <main class="main-panel">
            <section class="dashboard-intro">
                <div>
                    <div class="page-kicker">All user tables</div>
                    <h2>Available records</h2>
                    <p>Browse the user-facing data available in the system.</p>
                </div>
            </section>
            <div id="tablesContainer" class="cards"></div>
            <div class="top-buttons">
                <button id="returnToWelcomeButton">Return to welcome page</button>
                <button id="signOutButton">Sign out</button>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const name = localStorage.getItem('name');

            if (!name) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await fetch('/api/user/all-data');
                const data = await res.json();
                const container = document.getElementById('tablesContainer');
                container.innerHTML = '';

                for (const table in data) {
                    const tableData = data[table];
                    const tableDiv = document.createElement('div');
                    tableDiv.className = 'table-container';

                    const title = document.createElement('h3');
                    title.textContent = table;
                    tableDiv.appendChild(title);

                    if (tableData.error) {
                        tableDiv.innerHTML += `<p class="status-error">Error: ${tableData.error}</p>`;
                        container.appendChild(tableDiv);
                        continue;
                    }

                    if (tableData.length === 0) {
                        tableDiv.innerHTML += '<p>No records found.</p>';
                        container.appendChild(tableDiv);
                        continue;
                    }

                    const tbl = document.createElement('table');
                    const headerRow = document.createElement('tr');
                    for (const col in tableData[0]) {
                        const th = document.createElement('th');
                        th.textContent = col;
                        headerRow.appendChild(th);
                    }
                    tbl.appendChild(headerRow);

                    tableData.forEach(row => {
                        const tr = document.createElement('tr');
                        for (const col in row) {
                            const td = document.createElement('td');
                            td.textContent = row[col] ?? '';
                            tr.appendChild(td);
                        }
                        tbl.appendChild(tr);
                    });

                    tableDiv.appendChild(tbl);
                    container.appendChild(tableDiv);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('tablesContainer').innerHTML = '<div class="empty-state status-error">Failed to load tables.</div>';
            }
        });

        function goBack() {
            window.location.href = 'welcome.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        document.getElementById('returnToWelcomeButton').addEventListener('click', goBack);
        document.getElementById('signOutButton').addEventListener('click', logout);
    </script>
</body>

</html>
